<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSA Boys Fund | Running Tab</title>
<meta name="description" content="Live balances for the KSA Boys Fund running tab, pulled straight from the group's Google Sheet.">
<style>
  :root {
    --ink: #2B2118;
    --ink-soft: #5A4E40;
    --paper: #FAF6EE;
    --paper-dim: #F0E9D8;
    --line: #DDD3BC;
    --chili: #B8402A;
    --chili-soft: #F4E1DB;
    --maroon: #5C1A21;
    --basil: #4C6444;
    --basil-soft: #E4EADF;
    --gold: #D6A32B;
    --cream: #F3ECDD;
    --radius: 3px;
    --serif: Georgia, "Times New Roman", serif;
    --sans: Georgia, "Times New Roman", serif;
    --mono: Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; }

  .tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  button, input { font-family: inherit; }

  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* ---------- Hero ---------- */

  .hero {
    background:
      linear-gradient(180deg, rgba(24,18,12,0.80) 0%, rgba(24,18,12,0.90) 55%, rgba(24,18,12,0.97) 100%),
      url('https://images.pexels.com/photos/34463118/pexels-photo-34463118.jpeg?auto=compress&cs=tinysrgb&w=1920') center 38%/cover no-repeat;
    color: var(--cream);
    padding: 56px 24px 72px;
    position: relative;
  }

  .hero::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 14px;
    background:
      radial-gradient(circle at 10px 0, transparent 8px, var(--ink) 8.5px) top left,
      radial-gradient(circle at 10px 0, transparent 8px, var(--ink) 8.5px) top left;
    background-size: 20px 14px;
    background-repeat: repeat-x;
    background-color: var(--paper);
  }

  .hero-inner {
    max-width: 840px;
    margin: 0 auto;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #C9BEA9;
  }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #7EA36D;
    flex-shrink: 0;
  }
  .status-dot.error { background: var(--chili); }
  .status-dot.loading { background: var(--gold); animation: pulse 1.4s ease-in-out infinite; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  #refreshBtn {
    background: transparent;
    border: 1px solid #5A4E40;
    color: var(--cream);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    cursor: pointer;
  }
  #refreshBtn:hover { border-color: var(--gold); color: var(--gold); }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }

  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(40px, 8vw, 64px);
    line-height: 0.98;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .hero-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 28px 0 10px;
  }

  .hero-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .btn-3d {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--sans);
    text-decoration: none;
    border-radius: 7px;
    white-space: nowrap;
    border: 1px solid rgba(0,0,0,0.18);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .btn-3d.btn-gold {
    color: #2B2118;
    background: linear-gradient(180deg, #F3D888 0%, var(--gold) 100%);
    box-shadow: 0 3px 0 #93701C, 0 7px 14px rgba(0,0,0,0.4);
  }
  .btn-3d.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #93701C, 0 11px 18px rgba(0,0,0,0.45); }
  .btn-3d.btn-gold:active { transform: translateY(2px); box-shadow: 0 1px 0 #93701C, 0 2px 6px rgba(0,0,0,0.35); }

  .btn-3d.btn-cream {
    color: #2B2118;
    background: linear-gradient(180deg, #FFFDF9 0%, var(--cream) 100%);
    box-shadow: 0 3px 0 #B9AC8E, 0 7px 14px rgba(0,0,0,0.35);
  }
  .btn-3d.btn-cream:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #B9AC8E, 0 11px 18px rgba(0,0,0,0.4); }
  .btn-3d.btn-cream:active { transform: translateY(2px); box-shadow: 0 1px 0 #B9AC8E, 0 2px 6px rgba(0,0,0,0.3); }

  .hero-sub {
    font-size: 16px;
    color: #C9BEA9;
    max-width: 46ch;
    margin: 0;
  }

  .hero-sub strong { color: var(--cream); font-weight: 600; }

  /* ---------- Wrap ---------- */

  .wrap {
    max-width: 840px;
    margin: 0 auto;
    padding: 44px 24px 80px;
  }

  section + section { margin-top: 56px; }

  h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 24px;
    margin: 0 0 4px;
  }

  .section-note {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  /* ---------- Balance cards ---------- */

  .balance-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .balance-card {
    background: var(--paper);
    padding: 13px 16px;
  }

  .balance-name {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 4px;
  }

  .balance-amt {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
    margin: 0;
  }

  .balance-amt.owes { color: var(--chili); }
  .balance-amt.owed { color: var(--basil); }
  .balance-amt.even { color: var(--ink-soft); }

  .balance-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin: 2px 0 8px;
  }

  .balance-bar-track {
    height: 4px;
    background: var(--paper-dim);
    border-radius: 2px;
    overflow: hidden;
  }

  .balance-bar-fill {
    height: 100%;
    width: 0%;
    transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .balance-bar-fill.owes { background: var(--chili); }
  .balance-bar-fill.owed { background: var(--basil); }

  .balance-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    margin: 8px 0 0;
  }

  /* ---------- Who should pay ---------- */

  .payer-callout {
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    background: var(--cream);
    padding: 16px 20px;
    margin-top: 20px;
  }

  .payer-callout-label {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 24px;
    color: var(--ink);
    margin: 0 0 4px;
  }

  .payer-callout-names {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 22px;
    color: var(--maroon);
    margin: 0;
  }

  .payer-callout-names .sep {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 8px;
    vertical-align: middle;
  }

  /* ---------- Loading / error ---------- */

  .placeholder {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 20px 0;
  }

  .error-box {
    background: var(--chili-soft);
    border: 1px solid var(--chili);
    border-radius: var(--radius);
    padding: 18px;
    font-size: 14px;
  }
  .error-box p { margin: 0 0 12px; }
  .error-box button {
    background: var(--chili);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  @media (max-width: 520px) {
    .hero { padding: 40px 18px 60px; }
    .wrap { padding: 36px 18px 60px; }
    .balance-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .btn-3d { padding: 9px 16px; font-size: 12px; }
    .hero-actions { gap: 10px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="status">
        <span class="status-dot loading" id="statusDot"></span>
        <span id="statusText">Pulling the latest tab</span>
      </div>
      <button id="refreshBtn" disabled>Refresh</button>
    </div>
    <div class="hero-title-row">
      <h1>KSA Boys Fund</h1>
      <div class="hero-actions">
        <a id="entryFormLink" class="btn-3d btn-gold" href="https://docs.google.com/forms/d/e/1FAIpQLSfKxx_-I35FqXQVga1A4Vm311eem6THh9qH3TT3W2Ps-yFqsA/viewform" target="_blank" rel="noopener">Entry Form</a>
      </div>
    </div>
    <p class="hero-sub">Running tab <strong id="sinceLine"></strong></p>
  </div>
</div>

<div class="wrap">

  <section id="balanceSection">
    <h2>Who owes what</h2>
    <p class="section-note" id="balanceNote">Balances update as soon as the sheet does.</p>
    <div class="balance-grid" id="balanceGrid">
      <div class="placeholder">Loading balances…</div>
    </div>
    <div class="payer-callout" id="payerCallout" style="display:none">
      <p class="payer-callout-label">Who should pay today</p>
      <p class="payer-callout-names" id="payerCalloutNames"></p>
    </div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function () {
  "use strict";

  var SHEET_ID = "199GtlXSuQGqOoR5-tVuPpX4IysSCzjMs_eiSfwRi-K0";
  var CANDIDATES = [
    "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv&gid=0",
    "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv",
    "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&gid=0",
    "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv"
  ];
  var EXCLUDE = { "": 1, "date": 1, "day": 1, "particulars": 1, "blank": 1, "control": 1 };
  var AUTO_REFRESH_MS = 5 * 60 * 1000;

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var state = { transactions: [], people: [] };

  function parseAmt(v) {
    if (v == null) return 0;
    var s = String(v).trim();
    if (s === "") return 0;
    var neg = false;
    if (s.charAt(0) === "(" && s.charAt(s.length - 1) === ")") {
      neg = true;
      s = s.slice(1, -1);
    }
    s = s.replace(/,/g, "").replace(/SAR/gi, "").trim();
    var n = parseFloat(s);
    if (isNaN(n)) return 0;
    return neg ? -n : n;
  }

  function parseDMY(s) {
    var months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
    var parts = String(s).trim().split("-");
    if (parts.length !== 3) return null;
    var day = parseInt(parts[0], 10);
    var mon = months[parts[1].slice(0, 3).toLowerCase()];
    var year = parseInt(parts[2], 10);
    if (isNaN(day) || mon === undefined || isNaN(year)) return null;
    return new Date(year, mon, day);
  }

  function fmtMoney(n) {
    var abs = Math.abs(n);
    var rounded = Math.round(abs * 100) / 100;
    var isInt = rounded === Math.round(rounded);
    var opts = isInt ? { minimumFractionDigits: 0, maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
    return "SAR " + rounded.toLocaleString("en-US", opts);
  }

  function fmtK(n) {
    return (Math.abs(n) / 1000).toFixed(1) + " K";
  }

  function fmtDateShort(d) {
    if (!d) return "";
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  function relTime(ts) {
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 20) return "just now";
    if (s < 60) return s + "s ago";
    var m = Math.round(s / 60);
    if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
    var h = Math.round(m / 60);
    return h + (h === 1 ? " hour ago" : " hours ago");
  }

  function setStatus(mode, text) {
    var dot = document.getElementById("statusDot");
    var label = document.getElementById("statusText");
    dot.className = "status-dot" + (mode === "error" ? " error" : mode === "loading" ? " loading" : "");
    label.textContent = text;
  }

  function fetchFirstWorking(urls) {
    var i = 0;
    function attempt() {
      if (i >= urls.length) return Promise.reject(new Error("no source worked"));
      var url = urls[i] + (urls[i].indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now();
      i++;
      return fetch(url, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("bad status " + r.status);
          return r.text();
        })
        .then(function (text) {
          var parsed = parseSheet(text);
          if (!parsed) throw new Error("could not find Particulars header");
          return parsed;
        })
        .catch(function (err) {
          return attempt();
        });
    }
    return attempt();
  }

  function parseSheet(csvText) {
    var rows = Papa.parse(csvText, { skipEmptyLines: false }).data;

    var headerIdx = -1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].some(function (c) { return String(c).trim().toLowerCase() === "particulars"; })) {
        headerIdx = i;
        break;
      }
    }
    if (headerIdx === -1) return null;

    var header = rows[headerIdx];
    var dateCol = -1, dayCol = -1, particularsCol = -1;
    var people = [];
    header.forEach(function (c, idx) {
      var v = String(c).trim().toLowerCase();
      if (v === "date") dateCol = idx;
      else if (v === "day") dayCol = idx;
      else if (v === "particulars") particularsCol = idx;
      else if (!EXCLUDE[v]) people.push({ name: String(c).trim(), idx: idx });
    });
    if (particularsCol === -1 || dateCol === -1 || people.length === 0) return null;

    var balRowIdx = -1;
    for (var j = headerIdx + 1; j < rows.length; j++) {
      var p = String(rows[j][particularsCol] || "").toLowerCase();
      if (p.indexOf("receivable") > -1) { balRowIdx = j; break; }
    }
    if (balRowIdx === -1) return null;

    var balances = {};
    people.forEach(function (p) { balances[p.name] = parseAmt(rows[balRowIdx][p.idx]); });
    var asOfDate = parseDMY(rows[balRowIdx][dateCol]);

    var sinceDate = null;
    for (var k = headerIdx + 1; k < rows.length; k++) {
      var pk = String(rows[k][particularsCol] || "").toLowerCase();
      if (pk.indexOf("opening balance") > -1) { sinceDate = parseDMY(rows[k][dateCol]); break; }
    }

    var transactions = [];
    for (var m = balRowIdx + 1; m < rows.length; m++) {
      var row = rows[m];
      if (!row || row.length < 2) continue;
      var dateStr = String(row[dateCol] || "").trim();
      var particulars = String(row[particularsCol] || "").trim();
      if (!dateStr || !particulars) continue;
      var d = parseDMY(dateStr);
      if (!d) continue;
      var entries = {};
      people.forEach(function (p) {
        var v = parseAmt(row[p.idx]);
        if (v !== 0) entries[p.name] = v;
      });
      transactions.push({
        date: d,
        day: dayCol > -1 ? String(row[dayCol] || "").trim() : "",
        particulars: particulars,
        entries: entries
      });
    }

    return { people: people.map(function (p) { return p.name; }), balances: balances, asOfDate: asOfDate, sinceDate: sinceDate, transactions: transactions };
  }

  // Per person: how much they've fronted (the full bill, paid out of pocket) versus
  // their own reconstructed share of every outing they attended.
  function computePersonTotals(data) {
    var fronted = {};
    var expense = {};
    data.people.forEach(function (name) { fronted[name] = 0; expense[name] = 0; });

    data.transactions.forEach(function (t) {
      var positives = [];
      var participants = [];
      var payer = null;
      Object.keys(t.entries).forEach(function (k) {
        var v = t.entries[k];
        if (v === 0) return;
        participants.push(k);
        if (v < 0) payer = k;
        else positives.push(v);
      });
      var avgShare = positives.length ? positives.reduce(function (a, b) { return a + b; }, 0) / positives.length : 0;
      var billTotal = avgShare * participants.length;
      if (payer) fronted[payer] = (fronted[payer] || 0) + billTotal;
      participants.forEach(function (k) { expense[k] = (expense[k] || 0) + avgShare; });
    });

    return { fronted: fronted, expense: expense };
  }

  function renderBalances(data) {
    var grid = document.getElementById("balanceGrid");
    var names = Object.keys(data.balances);
    var maxAbs = Math.max.apply(null, names.map(function (n) { return Math.abs(data.balances[n]); }).concat([1]));
    var personTotals = computePersonTotals(data);

    var order = names.slice().sort(function (a, b) {
      return data.balances[b] - data.balances[a];
    });

    grid.innerHTML = "";
    order.forEach(function (name) {
      var amt = data.balances[name];
      var cls = amt > 0.5 ? "owes" : amt < -0.5 ? "owed" : "even";
      var label = amt > 0.5 ? "owes the tab" : amt < -0.5 ? "is owed" : "settled up";
      var subText = "Fronted " + fmtK(personTotals.fronted[name] || 0) + " less expense " + fmtK(personTotals.expense[name] || 0);

      var card = document.createElement("div");
      card.className = "balance-card";
      card.innerHTML =
        '<p class="balance-name">' + escapeHtml(name) + '</p>' +
        '<p class="balance-amt tabular ' + cls + '">' + fmtMoney(amt) + '</p>' +
        '<p class="balance-label">' + label + '</p>' +
        '<div class="balance-bar-track"><div class="balance-bar-fill ' + (cls === "even" ? "" : cls) + '" data-width="' + (Math.abs(amt) / maxAbs * 100) + '"></div></div>' +
        '<p class="balance-sub tabular">' + escapeHtml(subText) + '</p>';
      grid.appendChild(card);
    });

    requestAnimationFrame(function () {
      document.querySelectorAll(".balance-bar-fill").forEach(function (el) {
        el.style.width = reduceMotion ? el.dataset.width + "%" : "0%";
      });
      requestAnimationFrame(function () {
        document.querySelectorAll(".balance-bar-fill").forEach(function (el) {
          el.style.width = el.dataset.width + "%";
        });
      });
    });

    var noteBits = [];
    if (data.asOfDate) noteBits.push("Sheet last marked " + fmtDateShort(data.asOfDate));
    document.getElementById("balanceNote").textContent = noteBits.join(" · ") || "Balances update as soon as the sheet does.";

    if (data.sinceDate) {
      document.getElementById("sinceLine").textContent = "Running since " + data.sinceDate.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) + ".";
    }
  }

  function renderWhoShouldPay(data) {
    var box = document.getElementById("payerCallout");
    var namesEl = document.getElementById("payerCalloutNames");
    var owers = Object.keys(data.balances)
      .filter(function (n) { return data.balances[n] > 0.5; })
      .sort(function (a, b) { return data.balances[b] - data.balances[a]; });

    if (owers.length === 0) {
      box.style.display = "block";
      namesEl.textContent = "Everyone's settled up";
      return;
    }

    var top = owers.slice(0, 2);
    if (top.length === 1) {
      namesEl.textContent = top[0];
    } else {
      namesEl.innerHTML = escapeHtml(top[0]) + '<span class="sep">OR</span>' + escapeHtml(top[1]);
    }
    box.style.display = "block";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showError(msg) {
    setStatus("error", "Could not load");
    document.getElementById("balanceGrid").innerHTML =
      '<div class="error-box" style="grid-column:1/-1">' +
      '<p>The tab did not load. Make sure the sheet is still shared with anyone who has the link, then try again.</p>' +
      '<button id="retryBtn">Try again</button>' +
      '</div>';
    document.getElementById("retryBtn").addEventListener("click", load);
    document.getElementById("refreshBtn").disabled = false;
  }

  function load() {
    setStatus("loading", "Pulling the latest tab");
    document.getElementById("refreshBtn").disabled = true;

    fetchFirstWorking(CANDIDATES).then(function (data) {
      state.transactions = data.transactions;
      state.people = data.people;
      renderBalances(data);
      renderWhoShouldPay(data);
      var now = Date.now();
      setStatus("ok", "Updated " + relTime(now));
      document.getElementById("refreshBtn").disabled = false;
      clearInterval(window.__khabaTick);
      window.__khabaTick = setInterval(function () {
        setStatus("ok", "Updated " + relTime(now));
      }, 15000);
    }).catch(function () {
      showError();
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", load);

  load();
  setInterval(load, AUTO_REFRESH_MS);
})();
</script>
</body>
</html>
